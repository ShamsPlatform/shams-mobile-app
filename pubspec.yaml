name: shams_mobile_app
description: "Shams Platform - A production-ready Flutter application."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # Localizations (required for Arabic RTL support + code generation)
  flutter_localizations:
    sdk: flutter
  intl: any

  # Backend
  supabase_flutter: ^2.8.4

  # State Management
  provider: ^6.1.2

  # Image Picker
  image_picker: ^1.1.2

  # Typography
  google_fonts: ^6.2.1
  url_launcher: ^6.3.2
  share_plus: ^13.1.0
  timeago: ^3.7.1
  shared_preferences: ^2.5.5
  get_it: ^9.3.0
  loading_animation_widget: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo/shams logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/post image.jpg
    - assets/images/logo/shams texial logo for light mode.png
    - assets/images/logo/shams texial logo for dark mode.png
    - assets/images/logo/shams logo.png
    - assets/images/logo/shams texial logo light mode.png
    - assets/images/logo/shams texial logo for light mode small height.png
    # - assets/icons/
